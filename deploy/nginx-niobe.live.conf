# LIVE nginx config for pay.niobebeauty.com, copied from the droplet (/etc/nginx/sites-enabled/niobe)
# on 14 Oct 2026. The droplet is the source of truth; this copy exists so a rebuild does not
# lose the staff logins. nginx-niobe.conf next to it is only the original bare template.
# No secrets here: auth_basic_user_file lines are paths, the password files stay on the server.

# Nginx reverse proxy for the Niobe integration service.
# Copy to /etc/nginx/sites-available/niobe, symlink into sites-enabled, then run
# certbot (see DEPLOY.md) which rewrites this to add the HTTPS (443) block + certs.
#
# The app listens on 127.0.0.1:8080 (PORT=8080 in .env); Nginx is the public edge.

server {
    server_name pay.niobebeauty.com;

    # Payment providers post webhooks here (Hubtel/expressPay). Keep bodies small.
    client_max_body_size 1m;

    # Money and customer names — same staff login as the holds board.
    location = /abroad.html {
        auth_basic "Niobe staff";
        auth_basic_user_file /etc/nginx/.niobe_htpasswd;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/intl-payments {
        auth_basic "Niobe staff";
        auth_basic_user_file /etc/nginx/.niobe_htpasswd;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /holds.html {
        auth_basic "Niobe staff";
        auth_basic_user_file /etc/nginx/.niobe_htpasswd;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/holds {
        auth_basic "Niobe staff";
        auth_basic_user_file /etc/nginx/.niobe_htpasswd;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # --- per-branch desk (managed) ---
    # Read-only per-branch front-desk holds view. Each branch has its own login;
    # the app also gates these to office hours (8am-7pm GMT). The /desk/ safety-net
    # ensures no /desk/* path is ever served without a login.
    location /desk/ {
        auth_basic "Niobe staff";
        auth_basic_user_file /etc/nginx/.niobe_htpasswd;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # --- DESK ALIASES ---------------------------------------------------
    # A branch typing its own everyday name (/desk/c18) used to fall through to
    # the safety-net block, which asks for the CENTRAL login - so the branch got
    # a password box its own correct password could never open. Send the common
    # spellings to the canonical path instead, before any auth is asked for.
    location = /desk/african-regent { return 301 /desk/african_regent; }
    location = /desk/africanregent { return 301 /desk/african_regent; }
    location = /desk/alisa { return 301 /desk/alisa_hotel; }
    location = /desk/alisa-hotel { return 301 /desk/alisa_hotel; }
    location = /desk/alisa_tema { return 301 /desk/alisa_hotel; }
    location = /desk/alisatema { return 301 /desk/alisa_hotel; }
    location = /desk/ar { return 301 /desk/african_regent; }
    location = /desk/c18 { return 301 /desk/hfc_c18; }
    location = /desk/cantonment { return 301 /desk/cantonments; }
    location = /desk/community18 { return 301 /desk/hfc_c18; }
    location = /desk/ct { return 301 /desk/cantonments; }
    location = /desk/east-legon { return 301 /desk/east_legon; }
    location = /desk/eastlegon { return 301 /desk/east_legon; }
    location = /desk/el { return 301 /desk/east_legon; }
    location = /desk/hfc { return 301 /desk/hfc_c18; }
    location = /desk/hfc-c18 { return 301 /desk/hfc_c18; }
    location = /desk/hfcc18 { return 301 /desk/hfc_c18; }
    # A trailing slash reached the app as an unknown path and 404d.
    location ~ ^/desk/([A-Za-z0-9_-]+)/+$ { return 301 /desk/$1; }

    location /desk/east_legon {
        auth_basic "Niobe East Legon";
        auth_basic_user_file /etc/nginx/.niobe_desk_east_legon;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /desk/cantonments {
        auth_basic "Niobe Cantonments";
        auth_basic_user_file /etc/nginx/.niobe_desk_cantonments;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /desk/african_regent {
        auth_basic "Niobe African Regent Hotel";
        auth_basic_user_file /etc/nginx/.niobe_desk_african_regent;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /desk/hfc_c18 {
        auth_basic "Niobe HFC Community 18";
        auth_basic_user_file /etc/nginx/.niobe_desk_hfc_c18;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /desk/alisa_hotel {
        auth_basic "Niobe Alisa Hotel Tema";
        auth_basic_user_file /etc/nginx/.niobe_desk_alisa_hotel;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pay.niobebeauty.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pay.niobebeauty.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = pay.niobebeauty.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name pay.niobebeauty.com;
    return 404; # managed by Certbot


}
